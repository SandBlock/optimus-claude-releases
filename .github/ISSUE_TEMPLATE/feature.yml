name: Feature request
description: Suggest a new feature, improvement, or workflow.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the pain point or workflow gap. Skip implementation details for now.
      placeholder: "When I'm doing X, I have to Y, which is painful because ..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see happen?
      description: Your proposed solution, or a sketch of the behavior you'd want.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Workarounds you've tried, or other tools that solve this differently.
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues and didn't find a duplicate.
          required: true
